services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: audiohub
      POSTGRES_USER: audiohub
      POSTGRES_PASSWORD: audiohub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiohub -d audiohub"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro

  api:
    build: ./apps/api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://audiohub:audiohub@postgres:5432/audiohub?sslmode=disable
      JWT_SECRET: change-me-in-production
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret
      LIVEKIT_URL: ws://livekit:7880
      PUBLIC_LIVEKIT_URL: ws://localhost:7880
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
